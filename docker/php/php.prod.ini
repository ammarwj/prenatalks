; Batas unggah 20M memberi ruang di atas validasi terbesar aplikasi
; (cover artikel & thumbnail video 4 MB, foto tim 2 MB).
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60
expose_php = Off

; Kode di-bake ke image dan tidak pernah berubah selama container hidup,
; jadi validate_timestamps boleh mati — setiap deploy image-nya baru.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit_buffer_size = 64M
