services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./api:/var/www/html
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  # Pemroses antrean database (email verifikasi & reset password, ekspor
  # submission). Tanpa service ini job hanya menumpuk di tabel `jobs` dan
  # email tidak pernah terkirim.
  #
  # Urutan --queue menentukan prioritas: "emails" selalu dikuras lebih dulu
  # sampai kosong, jadi ekspor submission yang berjalan lama di "default"
  # tidak menahan email verifikasi/reset password di belakangnya.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --queue=emails,default --tries=3 --max-time=3600
    volumes:
      - ./api:/var/www/html
    environment:
      - DB_HOST=db
    # --max-time membuat worker berhenti sendiri tiap jam (higienis untuk
    # memori PHP yang long-running); restart-nya yang menghidupkan lagi.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=prenatalks
      - POSTGRES_USER=prenatalks
      - POSTGRES_PASSWORD=prenatalks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prenatalks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
